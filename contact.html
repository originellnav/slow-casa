  <style>
    /* Contact: heading and a short note on the left, the form on the right. */
    .contact { display: grid; grid-template-columns: 5fr 7fr; gap: clamp(40px, 6vw, 120px); padding: 96px var(--gutter) 0; align-items: start; }
    .contact-title { font-family: var(--display); font-weight: 400; font-size: clamp(36px, 4.4vw, 60px); line-height: 1.05; letter-spacing: 0.02em; margin: 0 0 28px; }
    .contact-lede { font-family: var(--body); font-size: 18px; line-height: 1.6; margin: 0; max-width: 34ch; color: var(--black); }
    .cf { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .cf-field { display: block; }
    .cf-wide { grid-column: 1 / -1; }
    .cf input, .cf textarea {
      width: 100%; font-family: var(--body); font-size: 16px; letter-spacing: 0.01em; color: var(--black);
      background: #fff; border: 1px solid var(--grey-3); padding: 20px 22px; outline: none; border-radius: 0;
      transition: border-color 0.2s;
    }
    .cf textarea { min-height: 200px; resize: vertical; line-height: 1.6; }
    .cf input::placeholder, .cf textarea::placeholder { color: var(--grey-1); }
    .cf input:focus, .cf textarea:focus { border-color: var(--black); }
    .cf-hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
    .cf-submit {
      grid-column: 1 / -1; margin-top: 16px; font-family: var(--body); font-size: 16px; letter-spacing: 0.01em;
      padding: 20px; border: 1px solid var(--black); background: var(--black); color: #fff; cursor: pointer; transition: opacity 0.2s;
    }
    .cf-submit:hover { opacity: 0.85; }
    .cf-submit[disabled] { opacity: 0.5; cursor: default; }
    .cf-msg { grid-column: 1 / -1; font-family: var(--body); font-size: 15px; color: var(--grey-1); margin: 0; min-height: 1.4em; }
    .cf-done { font-family: var(--body); font-size: 20px; line-height: 1.6; padding: 48px 0; border-top: 1px solid var(--grey-3); border-bottom: 1px solid var(--grey-3); }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    @media (max-width: 900px) {
      .contact { grid-template-columns: 1fr; padding: 56px 16px 0; gap: 36px; }
      .cf { grid-template-columns: 1fr; }
    }
  </style>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-B930Z6F96Z"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-B930Z6F96Z');
  </script>
  <script async src="https://plausible.io/js/pa-aahRJ1iMPfiu0NJteNWEg.js"></script>
  <script>
    window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
    plausible.init()
  </script>

  <style>
    .about-lede {
      max-width: 900px;
      margin: 0 auto;
      padding: 80px 48px 56px;
      text-align: center;
    }
    .about-lede h1 {
      font-family: var(--display);
      font-size: clamp(30px, 4.4vw, 46px);
      line-height: 1.15;
      letter-spacing: -0.01em;
      margin-bottom: 22px; letter-spacing: 0.02em; }
    .about-lede p {
      font-size: 17px;
      line-height: 1.6;
      color: var(--grey-1);
      max-width: 620px;
      margin: 0 auto;
    }

    .about-hero {
      width: 100%;
      aspect-ratio: 21/9;
      overflow: hidden;
      background: var(--grey-4);
      margin-bottom: 80px;
    }
    .about-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .about-section {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 48px 72px;
    }
    .about-label {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.01em;
      color: var(--grey-1);
      margin-bottom: 24px;
    }
    .about-section p {
      font-size: 17px;
      line-height: 1.68;
      margin-bottom: 20px;
    }
    .about-section p:last-child { margin-bottom: 0; }

    .about-list {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 48px 72px;
    }
    .about-item {
      border-top: 1px solid var(--line, #e4ddcd);
      padding: 26px 0;
    }
    .about-item:last-child { border-bottom: 1px solid var(--line, #e4ddcd); }
    .about-item h3 {
      font-family: var(--display);
      font-size: 24px;
      line-height: 1.2;
      margin-bottom: 8px; letter-spacing: 0.02em; }
    .about-item p {
      font-size: 15px;
      line-height: 1.6;
      color: var(--grey-1);
      margin-bottom: 12px;
    }
    .about-item a {
      font-size: 13px;
      letter-spacing: 0.01em;
      border-bottom: 1px solid var(--black);
      padding-bottom: 2px;
    }

    .about-cta {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 48px 96px;
      text-align: center;
    }
    .about-cta h2 {
      font-family: var(--display);
      font-size: 30px;
      line-height: 1.2;
      margin-bottom: 12px; letter-spacing: 0.02em; }
    .about-cta p { font-size: 16px; color: var(--grey-1); margin-bottom: 26px; }
    .about-btn {
      display: inline-block;
      font-size: 13px;
      letter-spacing: 0.01em;
      padding: 15px 30px;
      background: var(--black);
      color: #ffffff;
      transition: opacity 0.2s;
    }
    .about-btn:hover { opacity: 0.82; }

    @media (max-width: 768px) {
      .about-lede { padding: 48px 24px 36px; }
      .about-hero { aspect-ratio: 4/3; margin-bottom: 52px; }
      .about-section, .about-list, .about-cta { padding-left: 24px; padding-right: 24px; padding-bottom: 52px; }
    }
  </style>
</head>
<body>

  <!-- Site nav: generated from lib/nav.js. Keep in sync. -->
  <header class="site-nav">
    <a href="/" class="wordmark">Slow Casa</a>
    <div class="site-nav-right">
      <a class="site-nav-link" href="/houses">The Collection</a>
      <a class="site-nav-link" href="/magazine">Magazine</a>
      <button class="menu-btn" type="button" aria-expanded="false" aria-controls="site-menu">Menu <i class="burger" aria-hidden="true"></i></button>
    </div>
  </header>
  <div class="menu-scrim" data-menu-close></div>
  <aside class="site-menu" id="site-menu" aria-label="Menu" aria-hidden="true" inert>
    <div class="site-menu-top">
      <button class="menu-close" type="button" data-menu-close>Close <i class="burger is-x" aria-hidden="true"></i></button>
    </div>
    <div class="site-menu-links">
      <a href="/houses">The Collection</a>
      <a href="/magazine">Magazine</a>
      <a href="/map">Map</a>
      <a href="/contact?topic=list-your-house">List Your House</a>
    </div>
    <a class="site-menu-contact" href="/contact">Contact</a>
  </aside>
  <script src="/menu.js" defer></script>

  <main class="contact">
    <div>
      <h1 class="contact-title">Talk to Our Team</h1>
      <p class="contact-lede" id="cf-lede">Questions about a house, listing your own or working with us? Send us a message and we'll get back to you.</p>
    </div>

    <div>
      <form class="cf" id="cf" novalidate>
        <label class="cf-field"><span class="sr-only">First name</span><input name="firstName" type="text" placeholder="First Name" autocomplete="given-name" required /></label>
        <label class="cf-field"><span class="sr-only">Last name</span><input name="lastName" type="text" placeholder="Last Name" autocomplete="family-name" /></label>
        <label class="cf-field cf-wide"><span class="sr-only">Email</span><input name="email" type="email" placeholder="Email" autocomplete="email" required /></label>
        <label class="cf-field cf-wide"><span class="sr-only">Phone number (optional)</span><input name="phone" type="tel" placeholder="Phone Number (optional)" autocomplete="tel" /></label>
        <label class="cf-field cf-wide"><span class="sr-only">Message</span><textarea name="message" placeholder="Message" required></textarea></label>
        <!-- Hidden from people. Bots fill it in and get ignored. -->
        <div class="cf-hp" aria-hidden="true"><label>Website <input name="website" type="text" tabindex="-1" autocomplete="off" /></label></div>
        <input type="hidden" name="topic" value="" />
        <button class="cf-submit" type="submit">Send Message</button>
        <p class="cf-msg" id="cf-msg" role="status" aria-live="polite"></p>
      </form>
    </div>
  </main>
  <script>
  (function () {
    var form = document.getElementById('cf'); if (!form) return;
    var msg = document.getElementById('cf-msg');
    var started = Date.now();
    // /contact?topic=list-your-house (from the menu) sets the topic and the prompt.
    var topic = (new URLSearchParams(location.search).get('topic') || '').slice(0, 60);
    form.topic.value = topic;
    if (topic === 'list-your-house') {
      form.message.placeholder = 'Tell us about your house: where it is, a link to it and anything else we should know.';
    }
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var email = form.email.value.trim();
      if (!form.firstName.value.trim()) { msg.textContent = 'Please add your first name.'; form.firstName.focus(); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { msg.textContent = 'Please add a valid email.'; form.email.focus(); return; }
      if (form.message.value.trim().length < 2) { msg.textContent = 'Please add a message.'; form.message.focus(); return; }
      var btn = form.querySelector('.cf-submit');
      btn.disabled = true; msg.textContent = 'Sending...';
      fetch('/api/subscribe', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          kind: 'contact', firstName: form.firstName.value, lastName: form.lastName.value,
          email: email, phone: form.phone.value, message: form.message.value, topic: form.topic.value,
          hp: form.website.value, t: Date.now() - started
        })
      }).then(function (r) {
        if (!r.ok) throw new Error('failed');
        if (window.plausible) plausible('Contact Message', { props: { topic: topic || 'general' } });
        form.outerHTML = '<p class="cf-done">Thanks, your message is on its way. We\'ll get back to you soon.</p>';
      }).catch(function () {
        btn.disabled = false; msg.textContent = 'That did not send. Please try again.';
      });
    });
  })();
  </script>

  <!-- Footer: generated from lib/nav.js footer(). Keep in sync. -->
  <footer class="site-footer">

        <span class="footer-signup-msg" role="status" aria-live="polite"></span>

        <a href="/privacy">Privacy</a>
        <a href="/contact">Contact</a>
      </nav>
    </div>
  </footer>
</body>
